name: Data and benchmark

# Downloads the UCI archive (the build workspace cannot reach UCI), records or
# verifies its checksum, runs the semi-synthetic benchmark and commits the
# results. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      replicates:
        description: Replicate deployments per scenario
        default: "200"
      n_boot:
        description: Bootstrap resamples per window
        default: "200"

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Fetch UCI Diabetes 130-US Hospitals archive
        run: |
          zip=data/raw/diabetes_130_us_hospitals.zip
          if [ ! -f "$zip" ]; then
            curl -fsSL --retry 3 -o "$zip" \
              "https://archive.ics.uci.edu/static/public/296/diabetes+130-us+hospitals+for+years+1999-2008.zip"
          fi
          digest=$(sha256sum "$zip" | cut -d' ' -f1)
          if [ -f data/manifest.json ]; then
            recorded=$(python -c "import json;print(json.load(open('data/manifest.json'))['sha256'])")
            test "$digest" = "$recorded" || { echo "checksum changed: $digest vs $recorded"; exit 1; }
          else
            python - "$digest" <<'PY'
          import json, sys, datetime
          json.dump({"source": "https://archive.ics.uci.edu/static/public/296/diabetes+130-us+hospitals+for+years+1999-2008.zip",
                     "doi": "10.24432/C5230J", "license": "CC BY 4.0",
                     "sha256": sys.argv[1],
                     "downloaded_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")},
                    open("data/manifest.json", "w"), indent=2)
          PY
          fi
          unzip -l "$zip"
      - name: Run benchmark
        run: |
          python benchmarks/run_benchmark.py --replicates "${{ inputs.replicates }}" \
            --n-boot "${{ inputs.n_boot }}" --workers "$(nproc)"
      - name: Commit data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Benchmark results from UCI Diabetes 130-US Hospitals"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
